<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Kumquat</title>
  <style>
    :root {
      --bg: #17110d; --card: #211812; --line: rgba(255,255,255,.08); --text: #fff4ea; --muted: rgba(255,244,234,.6);
      --accent: #ff8a1f; --accent-2: #ffb347; --ink: #1b120c;
      font-family: "Segoe UI Variable", "Segoe UI", "Inter", "Noto Sans", "Ubuntu", system-ui, sans-serif; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
    header { display: flex; align-items: center; gap: 14px; padding: 26px 28px 8px; }
    .logo { width: 44px; height: 44px; border-radius: 50%; position: relative; flex: none;
      background: radial-gradient(circle at 34% 30%, #ffe0a8, #ffad4a 26%, #ff8a1f 52%, #e2620c 78%, #a9460a); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
    .logo::after { content: ''; position: absolute; right: 2px; top: -6px; width: 18px; height: 10px; border-radius: 100% 0;
      background: linear-gradient(135deg, #8fd16a, #3f8a2a); transform: rotate(-28deg); }
    h1 { font-size: 22px; margin: 0; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
    main { padding: 10px 28px 30px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 18px; margin: 14px 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-2); margin: 22px 0 6px 4px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row > span { flex: 1; }
    .hint { color: var(--muted); font-size: 12px; margin: 10px 0 2px; line-height: 1.45; }
    select, input[type=text] { background: #120d0a; color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font: inherit; min-width: 190px; }
    select:focus, input:focus { outline: none; border-color: var(--accent); }
    button { font: inherit; background: rgba(255,255,255,.07); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.12); }
    .switch { position: relative; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch i { position: absolute; inset: 0; border-radius: 99px; background: #3a2c22; transition: .2s; cursor: pointer; }
    .switch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch input:checked + i { background: var(--accent); }
    .switch input:checked + i::after { transform: translateX(18px); }
    .path { color: var(--muted); font-size: 12px; word-break: break-all; }
    .ok { color: #8fd16a; } .no { color: var(--muted); }
    footer { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 20px; }
    footer a { color: var(--accent-2); cursor: pointer; }
    .win-only { display: none; } body.win32 .win-only { display: flex; }
  </style>
</head>
<body>
  <header><div class="logo"></div><div><h1>Kumquat</h1><p id="tagline"></p></div></header>
  <main>
    <h2 data-t="settings.general"></h2>
    <section>
      <div class="row"><span data-t="settings.language"></span>
        <select id="language"><option value="auto" data-t="settings.languageAuto"></option><option value="en">English</option><option value="tr">Türkçe</option></select></div>
      <div class="row"><span data-t="settings.orb"></span><label class="switch"><input type="checkbox" id="showOrb"><i></i></label></div>
      <div class="row"><span data-t="settings.login"></span><label class="switch"><input type="checkbox" id="launchAtLogin"><i></i></label></div>
      <div class="row win-only"><span data-t="settings.sendTo"></span><label class="switch"><input type="checkbox" id="sendTo"><i></i></label></div>
      <div class="row win-only"><span><span data-t="settings.dragWheel"></span><span class="hint" style="display:block" data-t="settings.dragWheelHint"></span></span><label class="switch"><input type="checkbox" id="dragWheel"><i></i></label></div>
      <div class="row"><span data-t="settings.shortcut"></span><input type="text" id="shortcut" placeholder="CommandOrControl+Alt+K"></div>
    </section>

    <h2 data-t="settings.wheels"></h2>
    <section>
      <p class="hint" data-t="settings.wheelsHint"></p>
      <div class="row"><span data-t="convert"></span><select class="key" data-wheel="convert"></select></div>
      <div class="row"><span data-t="tools"></span><select class="key" data-wheel="tools"></select></div>
      <div class="row"><span data-t="actions"></span><select class="key" data-wheel="actions"></select></div>
      <div class="row"><span data-t="settings.defaultWheel"></span>
        <select id="defaultWheel"><option value="convert" data-t="convert"></option><option value="tools" data-t="tools"></option><option value="actions" data-t="actions"></option></select></div>
    </section>

    <h2 data-t="settings.output"></h2>
    <section>
      <div class="row"><span data-t="settings.output"></span>
        <select id="output"><option value="same" data-t="settings.outputSame"></option><option value="downloads" data-t="settings.outputDownloads"></option><option value="custom" data-t="settings.outputCustom"></option></select></div>
      <div class="row" id="customRow"><span class="path" id="customDir"></span><button id="chooseDir" data-t="settings.choose"></button></div>
      <div class="row"><span data-t="settings.afterDone"></span>
        <select id="afterDone"><option value="nothing" data-t="settings.afterNothing"></option><option value="reveal" data-t="settings.afterReveal"></option></select></div>
      <div class="row"><span data-t="settings.libreoffice"></span><span id="lo" style="flex:none"></span></div>
    </section>
  </main>
  <footer><span id="version"></span> · <a id="repo">github.com/TrinsyCa/kumquat</a> · MIT</footer>
  <script type="module" src="settings.js"></script>
</body>
</html>
