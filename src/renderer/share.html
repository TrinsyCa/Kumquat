<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Kumquat</title>
  <style>
    :root { font-family: "Segoe UI Variable", "Segoe UI", "Inter", "Noto Sans", "Ubuntu", system-ui, sans-serif; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: transparent; color: #fff4ea; user-select: none; }
    .card { position: absolute; inset: 10px; border-radius: 24px; padding: 22px; text-align: center;
      background: rgba(28, 20, 15, .97); border: 1px solid rgba(255, 138, 31, .3); box-shadow: 0 12px 34px rgba(0,0,0,.5);
      display: flex; flex-direction: column; align-items: center; -webkit-app-region: drag; }
    h1 { font-size: 17px; margin: 4px 0 14px; }
    img { width: 240px; height: 240px; border-radius: 16px; background: #fff; padding: 8px; }
    .url { font-size: 11.5px; color: rgba(255,244,234,.65); margin: 12px 0 6px; word-break: break-all; user-select: text; -webkit-app-region: no-drag; }
    .hint { font-size: 12px; color: rgba(255,244,234,.6); line-height: 1.45; margin: 0 8px; }
    .count { font-size: 12px; color: #ffb347; margin-top: 8px; min-height: 16px; }
    button { -webkit-app-region: no-drag; margin-top: auto; width: 100%; padding: 11px; border-radius: 12px; border: 0; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 600; background: linear-gradient(135deg, #ff8a1f, #ffb347); color: #1b120c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title"></h1>
    <img id="qr" alt="">
    <div class="url" id="url"></div>
    <p class="hint" id="hint"></p>
    <div class="count" id="count"></div>
    <button id="stop"></button>
  </div>
  <script type="module" src="share.js"></script>
</body>
</html>
